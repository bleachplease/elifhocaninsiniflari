// Pre-computes one whole rally (ball path + who moves/jumps when). The point's winner is a coin flip.
function buildRally(vb, T0, winner) {
  const g = vb.g;
  const S = vb.serving;
  const SLOW = CONFIG.VOLLEY_SLOW;
  const r0 = Math.random();
  const n = r0 < 0.3 ? 1 : r0 < 0.7 ? 2 : r0 < 0.9 ? 3 : 4;   // number of ball crossings
  const R = { segs: [], moves: [], jumps: [], acts: [], mi: 0, landT: 0, endT: 0, winner, scored: false, n, server: null, side: 0 };
  const plan = new Map();
  vb.teams.forEach((tm, t) => tm.forEach((w, i) => plan.set(w, vbHome(t, i))));

  const ms = x => T0 + x * 1000 * SLOW;
  const mv = (tt, w, p, dur) => { R.moves.push({ t: ms(tt), w, x: p.x, l: p.l, dur: dur * SLOW }); plan.set(w, p); };
  const jump = (w, t0, t1, kind, h) => R.jumps.push({ w, t0: ms(t0), t1: ms(t1), h, kind, on: false, pre: false });
  const act = (w, tt, kind) => R.acts.push({ w, t: ms(tt), kind });
  const seg = (t0, t1, a, b, apex) => R.segs.push({ t0: ms(t0), t1: ms(t1), a, b, apex });
  const toward = tm => -vside(tm);
  const clampL = l => Math.min(0.88, Math.max(0.32, l));

  const back = vb.teams[S].slice(2);
  const sv = pick(back.length ? back : vb.teams[S]);
  const spot = { x: g.cx + vside(S) * (g.W + 38), l: rand(0.40, 0.78) };
  R.server = sv;
  R.side = toward(S);
  mv(0, sv, spot, 0.45);

  let t = 0.5;
  let cur = { team: S, p: { x: spot.x + toward(S) * 16, l: spot.l }, z: 178 };
  seg(t, t + 0.35, { x: spot.x + toward(S) * 20, l: spot.l, z: 64 }, { x: cur.p.x, l: cur.p.l, z: cur.z }, 90);
  t += 0.35;
  jump(sv, t - 0.25, t + 0.12, "serve", 52);
  act(sv, t, "serve");

  for (let k = 1; k <= n; k++) {
    const X = cur.team, Y = 1 - X, sx = vside(X), sy = vside(Y);
    const serve = k === 1;
    const from = { x: cur.p.x, l: cur.p.l, z: cur.z };

    if (k < n) {
      // a normal crossing: Y digs it, sets it, and hits it back
      const dur = serve ? 0.7 : 0.4;
      const ys = vb.teams[Y];
      const r = pick(ys);
      const rp = plan.get(r);
      const tgt = { x: rp.x + rand(-14, 14), l: clampL(rp.l + rand(-0.02, 0.02)), z: 60 };
      seg(t, t + dur, from, tgt, serve ? 250 : 40);

      const front = ys.slice(0, 2).filter(q => q !== r);
      const setter = front.length ? pick(front) : pick(ys.filter(q => q !== r));
      const hitter = pick(ys.filter(q => q !== r && q !== setter));
      const setSpot = { x: g.cx + sy * 0.13 * g.W, l: 0.60 };
      const hitSpot = { x: g.cx + sy * 0.10 * g.W, l: Math.random() < 0.5 ? 0.42 : 0.76 };
      mv(t, setter, setSpot, dur + 0.25);
      mv(t + 0.1, hitter, hitSpot, dur + 0.5);
      t += dur;
      act(r, t, "bump");

      const setX = setSpot.x + toward(Y) * 8;
      seg(t, t + 0.35, { x: tgt.x, l: tgt.l, z: 60 }, { x: setX, l: setSpot.l, z: 128 }, 110);
      t += 0.35;
      act(setter, t, "set");
      seg(t, t + 0.3, { x: setX, l: setSpot.l, z: 128 }, { x: hitSpot.x + toward(Y) * 16, l: hitSpot.l, z: 190 }, 70);
      t += 0.3;
      jump(hitter, t - 0.25, t + 0.12, "spike", 56);
      act(hitter, t, "spike");
      cur = { team: Y, p: { x: hitSpot.x + toward(Y) * 16, l: hitSpot.l }, z: 190 };
    } else if (X === winner) {
      // the winner's hit lands inside the loser's court
      const land = { x: g.cx + sy * g.W * rand(0.3, 0.92), l: rand(0.36, 0.82), z: 0 };
      const dur = serve ? 0.7 : 0.36;
      seg(t, t + dur, from, land, serve ? 250 : 40);
      const ys = vb.teams[Y];
      let best = ys[0], bd = 1e9;
      for (const q of ys) {
        const p = plan.get(q);
        const d = Math.hypot(p.x - land.x, (p.l - land.l) * innerHeight * 0.42);
        if (d < bd) { bd = d; best = q; }
      }
      const bp = plan.get(best);
      mv(t, best, { x: bp.x + (land.x - bp.x) * 0.6, l: bp.l + (land.l - bp.l) * 0.6 }, dur);
      t += dur;
      act(best, t, "dig");
      R.landT = ms(t);
      seg(t, t + 0.2, land, { x: land.x + sy * 40, l: land.l, z: 0 }, 30);
      t += 0.2;
    } else if (Math.random() < 0.5) {
      // the loser hits it into the net
      const nx = g.cx + sx * 8;
      const d1 = serve ? 0.5 : 0.28;
      seg(t, t + d1, from, { x: nx, l: from.l, z: 140 }, serve ? 40 : 6);
      t += d1;
      seg(t, t + 0.4, { x: nx, l: from.l, z: 140 }, { x: nx + sx * 6, l: from.l, z: 0 }, 0);
      t += 0.4;
      R.landT = ms(t);
      seg(t, t + 0.2, { x: nx + sx * 6, l: from.l, z: 0 }, { x: nx + sx * 24, l: from.l, z: 0 }, 14);
      t += 0.2;
    } else {
      // the loser hits it out
      const land = { x: g.cx + sy * (g.W + rand(45, 110)), l: rand(0.34, 0.86), z: 0 };
      const dur = serve ? 0.72 : 0.38;
      seg(t, t + dur, from, land, serve ? 250 : 40);
      t += dur;
      R.landT = ms(t);
      seg(t, t + 0.2, land, { x: land.x + sy * 40, l: land.l, z: 0 }, 30);
      t += 0.2;
    }
  }

  R.endT = ms(t) + CONFIG.VOLLEY_PAUSE_MS;
  R.moves.sort((a, b) => a.t - b.t);
  return R;
}

function ballAt(vb, now) {
  const R = vb.R;
  const segs = R.segs;
  if (now < segs[0].t0) return { x: R.server.px + 45 + R.side * 20, l: R.server.sl, z: 64 };
  let s = segs[0];
  for (let i = segs.length - 1; i >= 0; i--) {
    if (now >= segs[i].t0) { s = segs[i]; break; }
  }
  const u = Math.min(1, (now - s.t0) / (s.t1 - s.t0));
  return {
    x: s.a.x + (s.b.x - s.a.x) * u,
    l: s.a.l + (s.b.l - s.a.l) * u,
    z: s.a.z + (s.b.z - s.a.z) * u + s.apex * 4 * u * (1 - u)
  };
}

function startPoint(vb, now) {
  vb.phase = "point";
  vb.setWinner = null;
  vb.teams.forEach((tm, t) => tm.forEach((w, i) => {
    w.vt = vbHome(t, i);
    w.vsp = 190;
    w.vface = -vside(t);
    w.jmp = null;
    w.jpre = null;
    w.acts = [];
    w.mood = null;
  }));
  const cur = vb.plan.sets[vb.setIdx];
  vb.R = buildRally(vb, now + 300, cur.seq[vb.pointIdx++]);
  for (const a of vb.R.acts) a.w.acts.push(a);
  vbScore();
}

function scorePoint(vb, now) {
  const R = vb.R;
  R.scored = true;
  const win = R.winner, los = 1 - win;
  vb.score[win]++;
  vbScore();

  const ref = vb.ref;
  ref.dir = vside(win) > 0 ? 1 : -1;
  ref.vface = ref.dir;
  ref.armUntil = now + 1100;
  wsay(ref, `${pick(VB_REF)} ${VB_TEAMS[win].name}`, 1700);

  vb.cheerUntil = now + 2000;
  vb.teams[win].forEach(w => { w.jmp = { t0: now, t1: now + 450, h: 22, kind: "cheer" }; w.jpre = null; w.mood = "happy"; });
  vb.teams[los].forEach(w => { w.mood = "sad"; });
  ref.whisUntil = now + 650;
  vb.teams.forEach((tm, t) => tm.forEach((w, i) => { w.vt = vbHome(t, i); w.vsp = 150; w.vface = -vside(t); }));
  shuffle(vb.fans).slice(0, 2).forEach(f => wsay(f, pick(VB_CHEERS), 1400));

  const cs = vb.plan.sets[vb.setIdx];
  if (vb.pointIdx >= cs.seq.length) vb.setWinner = cs.winner;
}

function afterPoint(vb, now) {
  const R = vb.R;
  if (vb.setWinner !== null) {
    const sw = vb.setWinner;
    vb.setWinner = null;
    vb.sets[sw]++;
    vb.lastSetWinner = sw;
    vbScore();

    if (vb.sets[sw] >= CONFIG.VOLLEY_SETS_TO_WIN) {
      vb.phase = "final";
      vb.until = now + CONFIG.VOLLEY_FINAL_MS;
      vb.cheerUntil = vb.until;
      vb.teams[sw].forEach(w => {
        w.celebrate = true;
        w.cph = rand(0, 6.28);
        w.jmp = null;
        w.el.classList.add("cheer");
      });
      vb.ref.dir = vside(sw) > 0 ? 1 : -1;
      vb.ref.vface = vb.ref.dir;
      vb.ref.armUntil = vb.until;
      vb.ref.whisUntil = now + 900;
      vb.teams[1 - sw].forEach(w => { w.mood = "sad"; });
      vbBanner(`🏆 Kazanan: ${VB_TEAMS[sw].name} Takım!`, `Set skoru ${vb.sets[0]} – ${vb.sets[1]}`, 7500);
      wsay(vb.ref, "Maç bitti!", 3000);
    } else {
      vb.phase = "break";
      vb.until = now + CONFIG.VOLLEY_BREAK_MS;
      vb.ref.whisUntil = now + 900;
      vb.teams[sw].forEach(w => { w.mood = "happy"; });
      vb.teams[1 - sw].forEach(w => { w.mood = "sad"; });
      vbBanner(`Set ${vb.setNo}: ${VB_TEAMS[sw].name} Takım`, `${vb.score[0]} – ${vb.score[1]}  •  Set skoru ${vb.sets[0]} – ${vb.sets[1]}`, CONFIG.VOLLEY_BREAK_MS - 200);
    }
    return;
  }
  vb.serving = R.winner;
  startPoint(vb, now);
}


// Plans a whole match up front so its length lands in the wanted range (4.4 - 9 min, mean 6.5 min).
function planVolleyMatch() {
  const C = CONFIG;
  // triangular distribution: min, max, and a mode chosen so that the mean is VOLLEY_MEAN_MS
  const a = C.VOLLEY_MIN_MS, b = C.VOLLEY_MAX_MS, c = 3 * C.VOLLEY_MEAN_MS - a - b;
  const u = Math.random(), Fc = (c - a) / (b - a);
  const D = u < Fc ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c));

  // sets: 2 (one team wins both) or 3 (one each, then a decider)
  const S = Math.random() < 0.4 ? 2 : 3;
  const first = Math.random() < 0.5 ? 0 : 1;
  const winners = S === 2 ? [first, first] : [first, 1 - first, Math.random() < 0.5 ? 0 : 1];

  const ptSec = 2.96 * C.VOLLEY_SLOW + 0.3 + C.VOLLEY_PAUSE_MS / 1000;   // average time per point
  const overhead = 8000 + C.VOLLEY_FINAL_MS + (S - 1) * C.VOLLEY_BREAK_MS;
  const N = Math.max(S * 12, Math.round((D - overhead) / 1000 / ptSec));

  const wts = winners.map(() => 1 + rand(-0.15, 0.15));
  const wsum = wts.reduce((x, y) => x + y, 0);
  const sets = winners.map((win, i) => {
    const tot = Math.max(12, Math.round(N * wts[i] / wsum));
    // winning margin: mostly close (2), sometimes bigger
    const opts = [[2, 50], [3, 20], [4, 15], [5, 10], [6, 5]].filter(([d]) => (tot - d) % 2 === 0 && (tot - d) / 2 >= 3);
    let r = Math.random() * opts.reduce((x, o) => x + o[1], 0), d = opts[0][0];
    for (const o of opts) { if ((r -= o[1]) < 0) { d = o[0]; break; } }
    const Pw = (tot + d) / 2, Pl = (tot - d) / 2;
    const seq = shuffle([...Array(Pw - 1).fill(win), ...Array(Pl).fill(1 - win)]);
    seq.push(win);   // the set always ends with the winner's point
    return { winner: win, seq };
  });
  return { sets, target: D };
}

function checkVolley(now) {
  if (!menu.classList.contains("gone")) return;
  if (!state.volley && !state.simit && !state.photo && !state.tug && now >= state.nextVolley) startVolley(now);
}

function startVolley(now) {
  const n = walkers.length;
  state.nextVolley = Infinity;
  if (n < 7) return;

  // the match overrides halay and solo dances
  if (state.halay) {
    state.halay = false;
    state.halayEnd = now;
  }

  const order = shuffle(walkers);
  const k = Math.min(5, Math.floor((n - 1) / 2));
  const teams = [order.slice(0, k), order.slice(k, 2 * k)];
  const ref = order[2 * k];
  const fans = order.slice(2 * k + 1);

  const mkEl = (tag, id) => {
    const e = document.createElement(tag);
    e.id = id;
    scene.appendChild(e);
    return e;
  };
  const els = {
    court: mkEl("div", "vcourt"),
    net: mkEl("div", "vnet"),
    shadow: mkEl("div", "vshadow"),
    ball: mkEl("div", "vball")
  };
  els.ball.innerHTML =
    '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="11" fill="#fdfdf8" stroke="#2b3a42" stroke-width="1.2"/>' +
    '<path d="M1.5 9 Q12 4 22.5 9" stroke="#2a62d6" stroke-width="2.4" fill="none"/>' +
    '<path d="M1.5 15 Q12 20 22.5 15" stroke="#f2b72a" stroke-width="2.4" fill="none"/>' +
    '<path d="M12 1 Q8 12 12 23" stroke="#2a62d6" stroke-width="2.2" fill="none"/></svg>';
  setTimeout(() => { els.court.classList.add("shown"); els.net.classList.add("shown"); }, 30);

  const vb = {
    phase: "intro",
    phaseStart: now,
    teams, ref, fans,
    all: walkers.slice(),
    score: [0, 0],
    sets: [0, 0],
    setNo: 1,
    serving: Math.random() < 0.5 ? 0 : 1,
    setWinner: null,
    plan: planVolleyMatch(),
    setIdx: 0,
    pointIdx: 0,
    lastSetWinner: 0,
    matchWinner: null,
    R: null,
    ball: null,
    until: 0,
    cheerUntil: 0,
    bannerT: null,
    key: "",
    g: null,
    els
  };
  state.volley = vb;
  vbLayout(vb);
  const g = vb.g;

  walkers.forEach((w, i) => {
    w.dance = null;
    w.el.classList.remove("dancing");
    w.sready = false;
    w.vt = null;
    w.varr = false;
    w.jmp = null;
    w.celebrate = false;
    w.mood = null;
    w.acts = null;
    w.exert = 0;
    w.el.classList.add("vsm");
    if (i % 2) w.el.classList.add("vsm2");
  });

  teams.forEach((tm, t) => tm.forEach((w, i) => {
    w.vb = "player";
    w.team = t;
    w.el.classList.add("jer");
    w.el.style.setProperty("--jc", VB_TEAMS[t].color);
    vbGo(w, vbHome(t, i), -vside(t), 5.2);
  }));

  ref.vb = "ref";
  ref.platform = 0;
  ref.el.classList.add("jer");
  ref.el.style.setProperty("--jc", "#25262b");
  vbGo(ref, vbRefSpot(g), -1, 5.2);

  const seats = vbSeats(fans.length, g);
  fans.forEach((w, i) => {
    w.vb = "fan";
    vbGo(w, seats[i], seats[i].x < g.cx ? 1 : -1, 5.2);
  });

  document.getElementById("vscore").classList.add("show");
  vbScore();
  vbBanner("🏐 Voleybol maçı!", `${VB_TEAMS[0].name} Takım – ${VB_TEAMS[1].name} Takım`, 4800);
  wsay(ref, "Takımlar sahaya!", 3500);
}

function joinVolley(w) {
  const vb = state.volley;
  const seat = vbSeats(1, vb.g)[0];
  w.vb = "fan";
  w.sready = false;
  w.vt = null;
  w.varr = false;
  w.el.classList.add("vsm");
  vb.fans.push(w);
  vb.all.push(w);
  vbGo(w, seat, seat.x < vb.g.cx ? 1 : -1, 4);
}

function stepVolley(w, dt, now) {
  const sPre = state.base * (0.75 + 0.25 * w.sl);
  if (!w.vbx) { w.vbx = true; w.el.classList.add("vbx"); }
  let moving = false;
  const t = w.vt;

  if (t) {
    const dx = t.x - (w.x + 45);
    const dl = t.l - w.sl;
    const dist = Math.hypot(dx, dl * innerHeight * 0.42);
    const step = w.vsp * dt;
    if (dist > 1.5 && step > 0) {
      if (dist <= step) {
        w.x = t.x - 45;
        w.sl = t.l;
      } else {
        const f = step / dist;
        w.x += dx * f;
        w.sl += dl * f;
        moving = true;
      }
      if (Math.abs(dx) > 1) w.dir = dx > 0 ? 1 : -1;
    }
  }

  w.varr = !t || !moving;
  if (!moving && w.vface) w.dir = w.vface;
  setStand(w, !moving);

  let jy = 0;
  const J = w.jmp;
  if (J && now >= J.t0 && now <= J.t1) {
    // take-off is fast, the hit happens at the top, the descent is a little slower
    jy = J.h * sPre * rgJumpCurve((now - J.t0) / (J.t1 - J.t0), (J.kind === "spike" || J.kind === "serve") ? 0.676 : 0.5);
  } else if (w.celebrate) {
    jy = 24 * sPre * Math.abs(Math.sin(now / 260 + w.cph));
  } else if (w.vb === "fan" && now < state.volley.cheerUntil) {
    jy = 7 * sPre * Math.abs(Math.sin(now / 230 + w.rgs)) * (w.rgs > 3.14 ? 1 : 0.35);
  }
  const A = rgFindAct(w, now);
  if (A && A.kind === "set" && A.tau > -110 && A.tau < 220) {
    jy += 9 * sPre * Math.sin(Math.PI * (A.tau + 110) / 330);   // setters hop slightly as they push the ball up
  }
  if (w.platform) jy += w.platform * sPre;
  w.jy = jy;
  vbAnimate(w, dt, now, moving, sPre, A);
}

function updateVolley(now, dt) {
  const vb = state.volley;
  if (!vb) return;

  // somebody was removed from the class: stop the match instead of leaving a ghost player
  if (vb.all.some(w => !walkers.includes(w))) {
    endVolley(now);
    return;
  }

  vbLayout(vb);

  if (vb.phase === "intro") {
    const waited = now - vb.phaseStart;
    if (waited >= 6000 && (vb.all.every(w => w.varr) || waited >= 11000)) {
      startPoint(vb, now);
    }
  } else if (vb.phase === "point") {
    const R = vb.R;
    while (R.mi < R.moves.length && R.moves[R.mi].t <= now) {
      const m = R.moves[R.mi++];
      const d = Math.hypot(m.x - (m.w.px + 45), (m.l - m.w.sl) * innerHeight * 0.42);
      m.w.vt = { x: m.x, l: m.l };
      m.w.vsp = Math.min(520, Math.max(70, d / Math.max(0.15, m.dur)));
    }
    for (const j of R.jumps) {
      if (!j.pre && now >= j.t0 - 380) {
        j.pre = true;
        j.w.jpre = j;
      }
      if (!j.on && now >= j.t0) {
        j.on = true;
        j.w.jmp = j;
      }
    }
    if (!R.scored && now >= R.landT) scorePoint(vb, now);
    if (now >= R.endT) afterPoint(vb, now);
  } else if (vb.phase === "break") {
    if (now >= vb.until) {
      vb.score = [0, 0];
      vb.setNo++;
      vb.setIdx++;
      vb.pointIdx = 0;
      vb.serving = 1 - vb.lastSetWinner;
      startPoint(vb, now);
    }
  } else if (vb.phase === "final") {
    if (now >= vb.until) {
      endVolley(now);
      return;
    }
  }

  vb.ball = vb.R ? ballAt(vb, now) : null;

  // the referee walks along the near side line, following the ball
  const rf = vb.ref;
  if (vb.phase === "point" && vb.R && now >= (rf.armUntil || 0)) {
    const bx = ballAt(vb, now).x;
    const half = vb.g.W * 0.6;
    const tx = vb.g.cx + Math.max(-half, Math.min(half, (bx - vb.g.cx) * 0.55));
    if (Math.abs(tx - (rf.x + 45)) > 28) {
      rf.vt = { x: tx, l: 0.96 };
      rf.vsp = 85;
      rf.vface = 0;
    }
  }

  const cheer = now < vb.cheerUntil;
  for (const w of vb.fans) w.el.classList.toggle("cheer", cheer);
  vb.ref.el.classList.toggle("armup", now < vb.ref.armUntil);
}

function renderVolley(now) {
  const vb = state.volley;
  if (!vb || !vb.R || !vb.g) return;

  const g = vb.g;
  const b = ballAt(vb, now);
  const s = g.sc(b.l);
  const d = Math.max(13, 23 * s);
  const fy = g.foot(b.l);
  const yc = fy - (b.z + 11) * s;

  const ball = vb.els.ball;
  ball.style.display = "block";
  ball.style.width = `${d}px`;
  ball.style.height = `${d}px`;
  ball.style.transform = `translate(${b.x - d / 2}px, ${yc - d / 2}px) rotate(${(now / 4) % 360}deg)`;

  const sh = vb.els.shadow;
  const sw = d * 1.1, shh = d * 0.36;
  sh.style.display = "block";
  sh.style.width = `${sw}px`;
  sh.style.height = `${shh}px`;
  sh.style.opacity = Math.max(0.15, 0.55 - b.z / 600);
  sh.style.transform = `translate(${b.x - sw / 2}px, ${fy - shh / 2}px)`;
}

function endVolley(now) {
  const vb = state.volley;
  if (!vb) return;

  clearTimeout(vb.bannerT);
  Object.values(vb.els).forEach(e => e.remove());
  document.getElementById("vscore").classList.remove("show");
  document.getElementById("vbanner").classList.remove("show");

  for (const w of walkers) {
    if (w.vb && w.sready) w.lane = Math.min(1, Math.max(0, w.sl));
    w.vb = null;
    w.vt = null;
    w.jmp = null;
    w.celebrate = false;
    w.jy = 0;
    w.platform = 0;
    w.armUntil = 0;
    w.sready = false;
    w.stand = false;
    w.speaking = false;
    clearTimeout(w.bt);
    w.el.querySelector(".bubble").classList.remove("show");
    w.el.classList.remove("jer", "cheer", "armup", "standing", "vsm", "vsm2", "vbx");
    w.vbx = false;
    w.acts = null;
    w.mood = null;
    w.jpre = null;
    w.rp = null;
    w.rf = null;
    w.gv = 0;
    w.whisUntil = 0;
  }

  state.volley = null;
  state.nextVolley = Infinity;
  state.nextHalay = Math.max(state.nextHalay, now + CONFIG.SIMIT_HALAY_DELAY);
  if (state.nextSimit < now + 3000) state.nextSimit = now + 3000;
  // the tug of war always starts exactly 1 minute after the match ends (whatever its length was)
  state.nextTug = now + CONFIG.TUG_AFTER_VOLLEY_MS;
}
/* =====================  /VOLLEYBALL  ===================== */

/* =====================  TUG OF WAR  ===================== */
// Starts exactly 1 minute after the volleyball match is over and overrides halay, solo dances, the simit
// scene and the class photo.  Two teams grab one rope, the flag in the middle swings back and forth and
// finally one team drags it over the line.  Everybody else cheers from behind.
const TUG_TEAMS = [{ name: "Turuncu", color: "#f08a1c" }, { name: "Yeşil", color: "#2f9e44" }];
const TUG_CHEERS = [
  "Çek çek çek!", "Bırakmayın!", "Hep birlikte!", "Biraz daha!", "Az kaldı, az kaldı!",
  "Güçlü çekin!", "Sakın bırakma!", "Haydi haydi haydi!", "Ayaklarını yere bas!", "Yaşasın takımımız!"
];
const TUG_L = 0.7;   // the lane the two teams stand on

function tgBanner(title, sub, ms) {
  const tg = state.tug;
  const el = document.getElementById("vbanner");
  el.querySelector("b").textContent = title;
  el.querySelector("small").textContent = sub || "";
  el.classList.add("show");
  if (tg) {
    clearTimeout(tg.bannerT);
    tg.bannerT = setTimeout(() => el.classList.remove("show"), ms);
  }
}

function checkTug(now) {
  if (!menu.classList.contains("gone")) return;
  if (state.tug || now < state.nextTug) return;
  if (state.volley) { state.nextTug = now + 1000; return; }   // never in the middle of a match
  startTug(now);
}

function startTug(now) {
  state.nextTug = Infinity;
  const n = walkers.length;
  if (n < CONFIG.TUG_MIN_PLAYERS) return;

  // the tug of war overrides everything else: halay, solo dances, the simit scene and the class photo
  if (state.halay) { state.halay = false; state.halayEnd = now; }
  if (state.simit) endSimit(now);
  if (state.photo) endPhoto(now);

  const sc = state.base * (0.75 + 0.25 * TUG_L);
  const room = innerWidth / 2 - 78 * sc - 46 * sc - 50;
  const k = Math.max(1, Math.min(CONFIG.TUG_MAX_PER_TEAM, Math.floor(n / 2), Math.floor(room / (44 * sc))));
  const order = shuffle(walkers);
  const teams = [order.slice(0, k), order.slice(k, 2 * k)];
  const fans = order.slice(2 * k);

  const field = document.createElement("div");
  field.id = "tugfield";
  field.innerHTML = '<i class="tl"></i><i class="tl mid"></i><i class="tl"></i>';
  scene.appendChild(field);
  const rope = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  rope.id = "tugrope";
  rope.innerHTML =
    '<path class="r0" fill="none" stroke="#5a3a12" stroke-linecap="round"/>' +
    '<path class="r1" fill="none" stroke="#c99a52" stroke-linecap="round"/>' +
    '<path class="r2" fill="none" stroke="#8a5f24" stroke-linecap="round"/>' +
    '<polygon class="fl" fill="#d62f2f" stroke="#7a1515" stroke-linejoin="round"/>';
  scene.appendChild(rope);
  setTimeout(() => field.classList.add("shown"), 30);

  const tg = state.tug = {
    phase: "gather", phaseStart: now, teams, fans, all: walkers.slice(),
    winner: Math.random() < 0.5 ? 0 : 1,
    D: rand(CONFIG.TUG_MIN_MS, CONFIG.TUG_MAX_MS),
    waves: rand(2.5, 4), sw: Math.random() < 0.5 ? 1 : -1,
    o: 0, locked: false, pullStart: 0, until: 0, step: 0, nextShout: 0,
    s: sc, cx: innerWidth / 2, G: 46 * sc, sp: 44 * sc, M: 78 * sc, L: TUG_L,
    bannerT: null, els: { field, rope }
  };

  walkers.forEach((w, i) => {
    w.dance = null;
    w.el.classList.remove("dancing");
    w.sready = false;
    w.wp = null;
    w.wait = 0;
    w.tgAt = false;
    w.tgSp = rand(140, 190);
    w.el.classList.add("vsm");
    if (i % 2) w.el.classList.add("vsm2");
  });
  teams.forEach((tm, t) => tm.forEach(w => {
    w.tg = "team";
    w.tgT = t;
    w.el.classList.add("jer");
    w.el.style.setProperty("--jc", TUG_TEAMS[t].color);
  }));
  fans.forEach(w => { w.tg = "fan"; });

}

function joinTug(w) {
  const tg = state.tug;
  w.tg = "fan";
  w.sready = false;
  w.wp = null;
  w.wait = 0;
  w.tgAt = false;
  w.tgSp = rand(140, 190);
  w.el.classList.add("vsm");
  tg.fans.push(w);
  tg.all.push(w);
}

function tugOffset(tg, p) {
  // team 0 stands on the left: when it wins the flag travels to the left (negative offset)
  const W = tg.winner === 0 ? -1 : 1;
  let o = W * tg.M * 0.86 * phSmooth(p);
  o += tg.sw * tg.M * 0.6 * Math.sin(p * Math.PI * 2 * tg.waves) * Math.pow(1 - p, 0.8);   // the flag swings back and forth
  o = phClamp(o, -0.95 * tg.M, 0.95 * tg.M);
  if (p > 0.92) o += W * tg.M * 0.14 * phSmooth((p - 0.92) / 0.08);                       // final heave over the line
  return phClamp(o, -tg.M, tg.M);
}

function stepTug(w, dt, now) {
  const tg = state.tug;
  const sPre = state.base * (0.75 + 0.25 * w.sl);
  const tx = w.tgX - 45, tl = w.tgL;
  let moving = false;

  if (w.tg === "team" && tg.locked) {
    // while pulling, the whole line travels with the rope
    w.x = tx; w.sl = tl; w.tgAt = true;
  } else {
    const dx = tx - w.x, dl = tl - w.sl;
    const dist = Math.hypot(dx, dl * innerHeight * 0.42);
    const step = w.tgSp * sPre * dt;
    if (dist > 1.5 && step > 0) {
      if (dist <= step) { w.x = tx; w.sl = tl; }
      else { const f = step / dist; w.x += dx * f; w.sl += dl * f; moving = true; }
      if (Math.abs(dx) > 1) w.dir = dx > 0 ? 1 : -1;
    }
    w.tgAt = !moving && dist <= 3;
  }
  if (!moving && w.tgFace) w.dir = w.tgFace;
  setStand(w, !moving);
}

function updateTug(now, dt) {
  const tg = state.tug;
  if (!tg) return;

  // somebody was removed from the class: stop instead of leaving a ghost on the rope
  if (!walkers.length || tg.all.some(w => !walkers.includes(w))) { endTug(now); return; }

  const sc = state.base * (0.75 + 0.25 * TUG_L);
  tg.s = sc; tg.cx = innerWidth / 2; tg.G = 46 * sc; tg.sp = 44 * sc; tg.M = 78 * sc;
  const [A, B] = tg.teams;
  const teamWalkers = A.concat(B);

  if (tg.phase === "gather") {
    const waited = now - tg.phaseStart;
    if ((waited >= 5000 && teamWalkers.every(w => w.tgAt)) || waited >= 15000) {
      tg.phase = "ready";
      tg.phaseStart = now;
      tg.step = 0;
      teamWalkers.forEach(w => w.el.classList.add("tug"));
      tg.els.rope.classList.add("shown");
    }
  } else if (tg.phase === "ready") {
    const t = now - tg.phaseStart;
    const seq = [[0, "Hazır!"], [1100, "3"], [2000, "2"], [2900, "1"], [3800, "ÇEK! 💪"]];
    while (tg.step < seq.length && t >= seq[tg.step][0]) {
      tgBanner(seq[tg.step][1], "", tg.step === seq.length - 1 ? 1300 : 800);
      tg.step++;
    }
    if (t >= CONFIG.TUG_READY_MS) {
      tg.phase = "pull";
      tg.pullStart = now;
      tg.locked = true;
      tg.nextShout = now + 1500;
      tg.fans.forEach(w => w.el.classList.add("cheer"));
    }
  } else if (tg.phase === "pull") {
    const p = Math.min(1, (now - tg.pullStart) / tg.D);
    tg.o = tugOffset(tg, p);
    if (now >= tg.nextShout) {
      const w = pick(walkers);
      if (w) say(w, pick(TUG_CHEERS));
      tg.nextShout = now + rand(1400, 2600);
    }
    if (p >= 1) {
      tg.phase = "end";
      tg.until = now + CONFIG.TUG_END_MS;
      tg.teams.forEach((tm, t) => tm.forEach(w => {
        w.el.classList.remove("tug");
        w.el.classList.add(t === tg.winner ? "cheer" : "tugfall");
      }));
      tgBanner(`🏆 ${TUG_TEAMS[tg.winner].name} Takım kazandı!`, "", CONFIG.TUG_END_MS - 600);
      const win = tg.teams[tg.winner];
      if (win.length) say(pick(win), "Yaşasın! Kazandık!");
    }
  } else if (tg.phase === "end") {
    if (now >= tg.until) { endTug(now); return; }
  }

  // positions: the teams stand on both sides of the flag, the fans spread out behind them
  A.forEach((w, i) => { w.tgX = tg.cx + tg.o - tg.G - i * tg.sp; w.tgL = TUG_L; w.tgFace = 1; });
  B.forEach((w, i) => { w.tgX = tg.cx + tg.o + tg.G + i * tg.sp; w.tgL = TUG_L; w.tgFace = -1; });
  const nf = tg.fans.length, rows = nf > 10 ? 2 : 1, per = Math.ceil(nf / rows);
  tg.fans.forEach((w, i) => {
    const r = rows === 2 ? i % 2 : 0;
    const col = rows === 2 ? Math.floor(i / 2) : i;
    w.tgX = innerWidth * 0.08 + (col + 0.5) * (innerWidth * 0.84 / per) + (r ? 12 : 0);
    w.tgL = r ? 0.16 : 0.3;
    w.tgFace = w.tgX < tg.cx ? 1 : -1;
  });
}

function renderTug(now) {
  const tg = state.tug;
  if (!tg) return;
  const s = tg.s, cx = tg.cx;
  const foot = innerHeight * 0.52 + TUG_L * innerHeight * 0.42;

  // ground marks: centre line and the two lines the flag has to cross
  const tl = tg.els.field.children;
  [cx, cx - tg.M, cx + tg.M].forEach((x, i) => {
    const el = tl[i];
    el.style.width = `${Math.max(2, 4 * s)}px`;
    el.style.height = `${36 * s}px`;
    el.style.transform = `translate(${x - 2 * s}px, ${foot - 12 * s}px)`;
  });

  // the rope runs from hand to hand, at the height of the pulling hands
  const k = Math.max(1, tg.teams[0].length);
  const hy = foot - 91 * s;
  const xl = cx + tg.o - tg.G - (k - 1) * tg.sp + 16.5 * s - 12 * s;
  const xr = cx + tg.o + tg.G + (k - 1) * tg.sp - 16.5 * s + 12 * s;
  const xm = cx + tg.o;
  const sag = (tg.phase === "pull" || tg.phase === "end" ? 2 : 9) * s;
  const d = `M${xl.toFixed(1)} ${hy.toFixed(1)} Q${xm.toFixed(1)} ${(hy + 2 * sag).toFixed(1)} ${xr.toFixed(1)} ${hy.toFixed(1)}`;
  const rope = tg.els.rope;
  rope.style.zIndex = Math.round(foot) + 1;
  const set = (cls, w, extra) => {
    const e = rope.querySelector(cls);
    e.setAttribute("d", d);
    e.setAttribute("stroke-width", (w * s).toFixed(2));
    if (extra) e.setAttribute("stroke-dasharray", `${(2 * s).toFixed(1)} ${(5 * s).toFixed(1)}`);
  };
  set(".r0", 6.4); set(".r1", 4.8); set(".r2", 4.8, true);
  const fy = hy + sag;
  rope.querySelector(".fl").setAttribute("points",
    `${(xm - 2.8 * s).toFixed(1)},${(fy - 1).toFixed(1)} ${(xm + 2.8 * s).toFixed(1)},${(fy - 1).toFixed(1)} ${xm.toFixed(1)},${(fy + 9 * s).toFixed(1)}`);
}

function cleanupTug() {
  const tg = state.tug;
  if (!tg) return;
  clearTimeout(tg.bannerT);
  Object.values(tg.els).forEach(e => e.remove());
  document.getElementById("vbanner").classList.remove("show");
  state.tug = null;
}

function endTug(now) {
  if (!state.tug) return;
  for (const w of walkers) {
    if (w.tg) {
      w.lane = phClamp(w.sl, 0, 1);
      w.dir = Math.random() < 0.5 ? 1 : -1;
    }
    w.tg = null;
    w.tgAt = false;
    w.sready = false;
    w.wp = null;
    w.wait = 0;
    w.stand = false;
    w.el.classList.remove("tug", "tugfall", "cheer", "jer", "vsm", "vsm2", "standing");
  }

function tSay(text, ms = 2600, second) {
  const b = state.trip && state.trip.bus; if (!b) return;
  const el = second ? b.b2 : b.bub, k = second ? "bt2" : "bt";

function busDims() { const bs = Math.min(1.6 * state.base, innerWidth * 0.42 / 360); return { bs, W: 360 * bs, H: 134 * bs }; }

function checkTrip(now) {
  if (!menu.classList.contains("gone") || state.trip || now < state.nextTrip) return;
  startTrip(now);
}
function startTrip(now) {

  state.halay = false; state.halayEnd = now; state.nextHalay = Infinity;
  for (const w of walkers) {

    w.sready = false; w.wp = null; w.wait = 0; w.tp = { m: "wait" }; w.tsc = null; w.tview = null; w.tz = null;
  }
  state.trip = { phase: "in", bus: makeTripBus(), queue: [], total: walkers.length, boarded: 0, nextBoard: 0, seq: [], names: [], at: 0, ft: null };
  tSay("Geldik çocuklar!", 2200);
}

function updateTrip(now, dt) {
  const tr = state.trip; if (!tr) return;
  const b = tr.bus, { bs, W, H } = busDims();
  tr.bs = bs; tr.W = W; tr.H = H;
  tr.doorX = b.x + W * 81 / 360;
  if (!walkers.length && tr.phase !== "dark") { finishTrip(now); return; }

  if (tr.phase === "in") {
    b.el.classList.add("rolling");
    const stop = innerWidth - W - 24;
    b.x = Math.max(stop, b.x - 260 * bs * dt);
    if (b.x <= stop) {
      b.el.classList.remove("rolling"); b.el.classList.add("open");
      tr.phase = "board"; tr.nextBoard = now + 900;
      tr.doorX = b.x + W * 81 / 360;
      tr.queue = walkers.slice().sort((p, q) => Math.abs(p.x + 45 - tr.doorX) - Math.abs(q.x + 45 - tr.doorX));
      tr.queue.forEach(w => { w.tp = { m: "q" }; w.wp = null; });
      tSay("Hadi çocuklar, sırayla binin!", 3000);
    }
  } else if (tr.phase === "board") {
    tr.queue = tr.queue.filter(w => walkers.includes(w) && w.tp && w.tp.m === "q");
    const head = tr.queue[0];
    if (head && head.atSlot && now >= tr.nextBoard) {
      head.tp = { m: "step", t0: now, s0: head.ss || 0.5 };
      tr.queue.shift(); tr.nextBoard = now + 380;
    }
    tr.cntTxt = `Binen: ${tr.boarded}/${tr.total}`;
    if (!tr.queue.length && walkers.every(w => w.tp && w.tp.m === "in")) {
      tr.phase = "count";
      let t = now; const S = (d, fn) => { t += d; tr.seq.push({ at: t, fn }); };
      const N = tr.boarded;
      S(400, () => tSay("Herkes bindi mi?", 2400));
      S(2800, () => tSay("Bir sayayım bakalım...", 1500));
      S(1900, () => {});
      for (let i = 1; i <= N; i++) S(i === 1 ? 0 : 110, () => tSay(String(i), 500));
      S(900, () => tSay("Bir eksik var!", 2200));
      S(2300, () => tSay((tr.names.length ? pick(tr.names) : "Biri") + ": Şoför abi, kendini saymadın!", 2800, true));
      S(3000, () => tSay("Ay, doğru ya! Tamam, herkes tam.", 2400));
      S(2800, () => { b.el.classList.remove("open"); tSay("Kapılar kapanıyor, bip bip!", 2200); });
      S(1500, () => { tr.phase = "leave"; tr.at = performance.now(); tr.dark = false; });
    }

    b.el.classList.add("rolling");

  } else if (tr.phase === "dark") {
    if (now - tr.at > 1800) startFair(now);
  } else if (tr.phase === "fair") {
    updateFair(now, dt);
    if (now - tr.fairT0 >= CONFIG.FAIR_FOR) { tr.phase = "out"; tr.at = now; curtainOn(""); }
  } else if (tr.phase === "out") {
    updateFair(now, dt);
    if (now - tr.at > 1200) { endFair(now); tr.phase = "back"; tr.at = now; curtainOff(); }
  } else if (tr.phase === "back") {
    if (now - tr.at > 1300) finishTrip(now);
  }

}

function stepTrip(w, dt, now) {
  const tr = state.trip, p = w.tp, base = state.base, sp = 140 * base * (0.75 + 0.25 * w.sl);
  w.tview = null;

  if (!tr.ft) w.tz = null;
  if (p.m === "wait") {
    if (!p.wp) p.wp = { x: rand(40, Math.max(60, innerWidth - 120)), y: tY(rand(0.4, 1)) };
    if (tWalk(w, dt, p.wp.x, p.wp.y, sp * 0.6)) p.wp = null;
  } else if (p.m === "q") {
    const rank = Math.max(0, tr.queue.indexOf(w));
    const avail = Math.max(80, tr.doorX - 24), sps = Math.max(28, 38 * base);
    const cols = Math.max(1, Math.floor(avail / sps)), rows = Math.max(1, Math.ceil(tr.total / cols));
    const col = Math.floor(rank / rows), row = rank % rows;
    const a = tWalk(w, dt, tr.doorX - col * sps, tY(0.47 + row * Math.min(0.14, 0.5 / rows)), sp * 1.5);

    w.tz = Math.max(Math.round(tY(w.sl)), busZ + 3);   // always in front of the bus
    if (a) w.tview = "front";
  } else if (p.m === "step") {
    const k = Math.min(1, (now - p.t0) / 320);
    tPos(w, tr.doorX, tY(0.45) - 10 * k * tr.bs);
    w.tz = busZ + 40;   // the student stays in front of the bus until hidden inside
    w.tsc = Math.max(0.02, p.s0 * (1 - k));
    w.el.classList.toggle("tnoname", k > 0.5);
    setStand(w, false);
    if (k >= 1) { w.el.style.display = "none"; p.m = "in"; tr.boarded++; tr.names.push(w.name); }
  } else if (p.m === "in") {
    // aboard the bus: hidden
  } else if (tr.ft) {
    stepFairWalker(w, dt, now);
  }
}

function joinTrip(w) {
  const tr = state.trip;
  if (tr.ft) { const key = chooseQ(tr.ft); w.tp = { m: "cq", q: key }; w.el.classList.add("tsmall"); w.el.querySelector(".flipper").insertAdjacentHTML("beforeend", '<i class="phone"></i>'); qArr(tr.ft, key).push(w); }
  else if (tr.phase === "in" || tr.phase === "board") {
    w.tp = { m: tr.phase === "board" ? "q" : "wait" };
    if (tr.phase === "board") { tr.queue.push(w); tr.total++; }
  } else w.tp = null;
}

    const sceneMode = state.trip && w.tp ? "trip" : state.tug && w.tg ? "tug" : state.simit && w.sm ? "simit" : (state.volley && w.vb ? "volley" : (state.photo && w.ph ? "photo" : null));
    const sceneOn = !!sceneMode && w.hk <= 0 && w.k < 0.03;
    if (sceneOn && !w.sready) {
      w.sready = true;
      w.sl = w.lane + (1 - w.lane) * w.k;
      w.k = 0;
    }

    let L = w.lane + (1 - w.lane) * w.k;
    let tx = 0;
    let th = 0;

    if (sceneOn) {
      if (sceneMode === "trip") stepTrip(w, dt, now);
      else if (sceneMode === "tug") stepTug(w, dt, now);
      else if (sceneMode === "simit") stepScene(w, dt, now);
      else if (sceneMode === "photo") stepPhoto(w, dt, now);
      else stepVolley(w, dt, now);
      L = w.sl;
    }

    if (w.hk > 0) {
      th = ellipseAngle(e0, i * e0.P / walkers.length + rotD);
      const rock = st.F * e * e;   // forward = toward the centre of the ring
      tx = e0.cx + e0.rx * Math.cos(th) - 45 - Math.cos(th) * stepA * rock;
      const tf = e0.cy + e0.ry * Math.sin(th) - Math.sin(th) * stepA * stepYk * rock;
      L += ((tf - innerHeight * 0.52) / (innerHeight * 0.42) - L) * e;
    }

    const pm = sceneOn && sceneMode === "photo" ? state.photo.mul : 1;
    let s = base * pm * (0.75 + 0.25 * L) * (1 + 0.7 * w.k) * (1 + (e0.hs - 1) * e);
    if (sceneOn && sceneMode === "trip" && w.tsc) s = w.tsc;
    const h = 150 * s;

    if (sceneOn) {
      // position handled by stepScene
    } else if (state.halay || w.hk > 0) {
      // ring state handled below
    } else if (w.dance) {
      w.x += (innerWidth / 2 - 45 - w.x) * Math.min(1, dt * 2);
    } else {
      w.x += w.dir * w.speed * s * dt;
      if (w.x < -90) w.dir = 1;
      else if (w.x < -10 && w.dir < 0) w.dir = 1;
      if (w.x > innerWidth) w.dir = -1;
      else if (w.x > innerWidth - 80 && w.dir > 0) w.dir = -1;
    }

    const px = w.hk > 0 ? w.x + (tx - w.x) * e : w.x;
    w.px = px;
    const arrived = state.halay && w.hk >= 1;
    let view = "side";
    if (sceneOn && sceneMode === "photo" && w.phAt) view = "front";
    if (sceneOn && sceneMode === "trip" && w.tview) view = w.tview;

    if (arrived) {
      const fx = -Math.cos(th);
      const fy = -Math.sin(th);
      if (fy > 0.6) view = "front";
      else if (fy < -0.6) view = "back";
      else w.dir = fx > 0 ? 1 : -1;
    } else if (w.hk > 0) {
      const d = (state.halay ? tx : w.x) - px;
      if (Math.abs(d) > 1) w.dir = d > 0 ? 1 : -1;
    }

    if (view !== w.view) {
      w.view = view;
      w.el.dataset.view = view;
    }

    if (arrived !== w.hal) {
      w.hal = arrived;
      w.el.classList.toggle("hal", arrived);
      if (!arrived) clearPose(w);
    }

    w.el.classList.toggle("alt", arrived && i % 2 === 1);

    if (arrived) pose(w, view, st);

    const foot = innerHeight * 0.52 + L * innerHeight * 0.42;
    w.sx = px + 45;
    w.sf = foot - (w.jy || 0);
    w.ss = s;
    w.stop = foot - h - (w.jy || 0);
    w.el.style.height = `${h}px`;
    w.el.style.transform = `translate(${px}px, ${foot - h - (w.jy || 0)}px)`;
    w.el.style.zIndex = w.speaking ? 9000 : (sceneOn && sceneMode === "trip" && w.tz != null ? w.tz : (w.dance ? 8500 : Math.round(foot)));
    w.el.querySelector(".flipper").style.transform = `scale(${view === "side" && w.dir < 0 ? -s : s}, ${s})`;

    if (now > w.nextTalk) {
      // nobody chats during the halay: the speech bubbles would cover the dancers
      if (state.halay) { w.nextTalk = now + rand(4000, 8000); continue; }
      if (state.photo && state.photo.quiet) { w.nextTalk = now + rand(2000, 4000); continue; }
      if (state.trip && w.tp && (w.tp.m === "in" || w.tp.m === "step" || /ride|board/.test(w.tp.m))) { w.nextTalk = now + rand(3000, 6000); continue; }
      say(w);
      w.nextTalk = now + rand(0.7, 1.3) * Math.max(5000, n * 1400);
    }
  }

  if (state.halay) updateHalayArms(st);

  renderVendor(now);
  renderVolley(now);
  renderPhoto(now);
  renderTug(now);
  renderTrip(now);
  requestAnimationFrame(tick);
}

let chatHide = null;

function showChat() {
  if (!menu.classList.contains("gone") || walkers.length < 2 || state.volley || state.tug || state.trip) return;

  const a = pick(walkers);
  let b = pick(walkers);
  while (b === a) {
    b = pick(walkers);
  }

  const [m1, m2] = chat.querySelectorAll(".msg");
  m1.querySelector(".av").innerHTML = faceSvg(a);
  m1.querySelector("b").textContent = a.name;
  const exchange = pickExchange();
  m1.querySelector("span").textContent = exchange.q;

  m2.querySelector(".av").innerHTML = faceSvg(b);
  m2.querySelector("b").textContent = b.name;
  m2.querySelector("span").textContent = exchange.a;

  chat.classList.add("show");
  chat.setAttribute("aria-hidden", "false");
  clearTimeout(chatHide);
  chatHide = setTimeout(() => {
    chat.classList.remove("show");
    chat.setAttribute("aria-hidden", "true");
  }, CONFIG.POPUP_STAYS);
}

function faceSvg(w) {
  return svg(w.shirt, w.skin, "front", w.girl).replace(/class="person[^"]*" viewBox="0 0 90 150"/, 'viewBox="14 8 62 62"');
}

function startDance() {
  if (!menu.classList.contains("gone") || state.halay || state.simit || state.volley || state.photo || state.tug || state.trip || state.nextTrip !== Infinity) return;
  if (performance.now() >= state.nextTug - CONFIG.SIMIT_GUARD_MS) return;
  if (performance.now() >= state.nextPhoto - CONFIG.SIMIT_GUARD_MS) return;
  if (performance.now() >= state.nextSimit - CONFIG.SIMIT_GUARD_MS) return;
  if (performance.now() >= state.nextMacun - CONFIG.SIMIT_GUARD_MS) return;
  if (performance.now() >= state.nextVolley - CONFIG.SIMIT_GUARD_MS) return;

  const free = walkers.filter(w => !w.dance);
  if (!free.length || free.length < walkers.length) return;

  const w = pick(free);
  w.dance = performance.now() + CONFIG.DANCE_FOR;
  w.el.classList.add("dancing");
}

function saveClass() {
  if (!state.current) return;

  try {
    localStorage.setItem("qw-" + state.current, JSON.stringify(walkers.map(w => w.name)));
  } catch (error) {
    // no-op: storage may be unavailable in some browsers
  }
}

function openClass(className) {
  closeClass();
  state.current = className;

  let names = Array.isArray(CLASSES[className]) ? [...CLASSES[className]] : [];

  try {
    const saved = JSON.parse(localStorage.getItem("qw-" + className));
    if (Array.isArray(saved) && saved.length) names = saved;
  } catch (error) {
    // ignore malformed saved data
  }

  state.expected = names.length;
  menu.classList.add("gone");
  state.nextHalay = performance.now() + CONFIG.HALAY_EVERY;
  state.nextSimit = performance.now() + CONFIG.SIMIT_FIRST;
  state.nextMacun = Infinity;
  state.nextTrip = Infinity;
  state.nextVolley = performance.now() + CONFIG.VOLLEY_AT;
  state.nextPhoto = performance.now() + CONFIG.PHOTO_AT;

  const titleNode = document.getElementById("title").firstChild;
  if (titleNode) titleNode.textContent = "Konuşma sınavı devam ediyor – " + className;

  const gap = Math.min(CONFIG.ARRIVAL_GAP_MAX_MS, CONFIG.ARRIVAL_WINDOW_MS / Math.max(1, names.length));
  names.forEach((name, index) => {
    state.timers.push(setTimeout(() => addStudent(name, index), 400 + index * gap));
  });
}

function closeClass() {
  state.timers.forEach(clearTimeout);
  state.timers = [];

  walkers.splice(0).forEach(w => w.el.remove());
  chat.classList.remove("show");
  chat.setAttribute("aria-hidden", "true");

  state.expected = 0;
  state.activeBubbles = 0;
  state.halay = false;
  state.nextHalay = Infinity;
  state.halayStart = 0;
  state.halayEnd = 0;
  if (state.simit) {
    clearTimeout(state.simit.vendor.bt);
    state.simit.vendor.el.remove();
    state.simit = null;
  }
  state.nextSimit = Infinity;
  state.nextMacun = Infinity;
  cleanupTrip();
  state.nextTrip = Infinity;
  document.body.classList.remove("dusk");
  if (state.volley) {
    clearTimeout(state.volley.bannerT);
    Object.values(state.volley.els).forEach(e => e.remove());
    document.getElementById("vscore").classList.remove("show");
    document.getElementById("vbanner").classList.remove("show");
    state.volley = null;
  }
  state.nextVolley = Infinity;
  cleanupPhoto();
  state.nextPhoto = Infinity;
  cleanupTug();
  state.nextTug = Infinity;
  state.current = null;
  menu.classList.remove("gone");
}

function addFromInput() {
  const name = sanitizeName(input.value);
  if (!name) return;

  addStudent(name, walkers.length);
  input.value = "";
  saveClass();
}

Object.keys(CLASSES).forEach(className => {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = className;
  button.addEventListener("click", () => openClass(className));
  document.getElementById("classes").appendChild(button);
});

document.getElementById("back").addEventListener("click", closeClass);
document.getElementById("add").addEventListener("click", addFromInput);
document.getElementById("remove").addEventListener("click", () => {
  const w = walkers.pop();
  if (w) {
    w.el.remove();
    saveClass();
  }
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    addFromInput();
  }
});

const panel = document.getElementById("panel");
document.getElementById("hide").addEventListener("click", () => panel.classList.add("hidden"));

addEventListener("keydown", event => {
  if (event.target === input) return;
  if (event.key.toLowerCase() === "h") panel.classList.toggle("hidden");
});


const birdsLayer = document.getElementById("birds");
const birds = [];
const BIRD_COUNT = 7;

function makeBird() {
  const el = document.createElement("div");
  el.className = "bird";
  el.innerHTML =
    '<svg viewBox="0 0 40 20" xmlns="http://www.w3.org/2000/svg">' +
    '<path class="wing l" d="M20 11 Q12 2 2 6"/>' +
    '<path class="wing r" d="M20 11 Q28 2 38 6"/>' +
    '<ellipse cx="20" cy="12" rx="3.2" ry="2.4" fill="#3b4a52"/>' +
    '</svg>';
  const wings = el.querySelectorAll(".wing");
  const d = rand(0, 0.45);
  wings.forEach(w => { w.style.animationDelay = `-${d}s`; w.style.animationDuration = `${rand(0.35, 0.6)}s`; });
  birdsLayer.appendChild(el);

  return {
    el,
    x: rand(0, innerWidth),
    y: rand(0.12, 0.9),
    dir: Math.random() < 0.5 ? 1 : -1,
    speed: rand(40, 90),
    scale: rand(0.7, 1.3),
    bobAmp: rand(6, 16),
    bobSpeed: rand(0.6, 1.4),
    phase: rand(0, Math.PI * 2)
  };
}

for (let i = 0; i < BIRD_COUNT; i++) birds.push(makeBird());

function flyBirds(now) {
  const t = now / 1000;
  const dt = Math.min(0.1, (now - (flyBirds.last || now)) / 1000);
  flyBirds.last = now;
  const h = innerHeight * 0.38;

  for (const b of birds) {
    b.x += b.dir * b.speed * dt;
    if (b.dir > 0 && b.x > innerWidth + 60) { b.x = -60; b.y = rand(0.12, 0.9); }
    if (b.dir < 0 && b.x < -60) { b.x = innerWidth + 60; b.y = rand(0.12, 0.9); }

    const yy = 40 + b.y * (h - 90) + Math.sin(t * b.bobSpeed + b.phase) * b.bobAmp;
    b.el.style.transform = `translate(${b.x}px, ${yy}px) scale(${b.dir * b.scale}, ${b.scale})`;
  }

  requestAnimationFrame(flyBirds);
}
requestAnimationFrame(flyBirds);

(function buildTreeline() {
  // Bumpy canopy silhouette along the horizon (seeded so it looks the same every load).
  let s = 7;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let d = "M0 124 L0 104";
  let x = 0;
  while (x < 1000) {
    const w = 10 + r() * 18;
    const h = 96 + r() * 12 - (Math.sin(x / 140) + 1) * 5;
    d += ` Q${(x + w / 2).toFixed(1)} ${(h - 9).toFixed(1)} ${(x + w).toFixed(1)} ${(100 + r() * 8).toFixed(1)}`;
    x += w;
  }
  d += " L1000 124Z";
  document.getElementById("treeline").setAttribute("d", d);
})();

setInterval(showChat, CONFIG.POPUP_EVERY);
setInterval(startDance, CONFIG.DANCE_EVERY);
requestAnimationFrame(tick);
</script>
