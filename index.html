<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Walk</title>
<style>
  :root{--sky:#cfe8f3;--grass:#9fcf8a;--path:#e9dcc0;--ink:#2b3a42;--bubble:#fffdf6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0;background:linear-gradient(var(--sky) 0 38%,var(--grass) 38% 100%)}
  #path{position:absolute;left:0;right:0;top:52%;bottom:6%;background:var(--path);border-top:6px solid #d3c29c;border-bottom:6px solid #d3c29c}
  #title{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:clamp(18px,3vw,34px);font-weight:bold}
  #title small{display:block;font-size:.45em;font-weight:normal;opacity:.75}
  .walker{position:absolute;width:90px;will-change:transform}
  .flipper{position:absolute;bottom:0;left:50%;width:90px;height:150px;margin-left:-45px;transform-origin:50% 100%}
  .flip{transform:scaleX(-1)}
  .person{position:absolute;inset:0}
  .name{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--ink);color:#fff;
        padding:2px 10px;border-radius:12px;font-size:13px;white-space:nowrap}
  .bubble{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:34px;background:var(--bubble);
        border:2px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:15px;width:max-content;max-width:210px;
        text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
  .bubble.show{opacity:1}
  .leg{transform-origin:45px 98px;animation:swing .7s ease-in-out infinite alternate}
  .leg.b{animation-delay:-.7s;animation-direction:alternate-reverse}
  .arm{transform-origin:45px 68px;animation:swing .7s ease-in-out infinite alternate-reverse}
  @keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  #panel{position:fixed;right:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:12px;padding:10px;z-index:20;
         display:flex;gap:6px;flex-wrap:wrap;max-width:340px;font-size:14px}
  #panel input{flex:1;min-width:120px;padding:6px;border:1px solid #999;border-radius:8px;font-size:15px}
  #panel button{padding:6px 10px;border:0;border-radius:8px;background:var(--ink);color:#fff;cursor:pointer;font-size:14px}
  #panel.hidden{display:none}
  #menu{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
        background:linear-gradient(var(--sky) 0 45%,var(--grass) 45% 100%)}
  #menu h1{margin:0;font-size:clamp(26px,5vw,56px);text-align:center}
  #classes{display:grid;grid-template-columns:repeat(2,minmax(130px,200px));gap:16px}
  #classes button{padding:22px 10px;font-size:clamp(22px,4vw,36px);font-weight:bold;border:3px solid var(--ink);border-radius:18px;
        background:var(--bubble);color:var(--ink);cursor:pointer;font-family:inherit}
  #classes button:hover,#classes button:focus-visible{background:var(--ink);color:#fff;outline:none}
  #menu.gone{display:none}
  #chat{position:fixed;top:92px;left:50%;width:min(520px,94vw);transform:translate(-50%,-10px);z-index:30;opacity:0;
        transition:opacity .35s,transform .35s;pointer-events:none;display:flex;flex-direction:column;gap:10px}
  #chat.show{opacity:1;transform:translate(-50%,0)}
  #chat .msg{display:flex;align-items:center;gap:10px}
  #chat .out{justify-content:flex-end}
  #chat .av{flex:none;width:64px;height:64px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px #4da3ff;
        background:linear-gradient(135deg,#6ec6ff,#c28bff,#ffd36e);overflow:hidden}
  #chat .av svg{display:block;width:100%;height:100%}
  #chat .bub{padding:10px 16px;border-radius:18px;font-size:15px;line-height:1.3;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  #chat .in .bub{background:#1d5fe0;color:#fff}
  #chat .out .bub{background:#7bd36b;color:#1d3a1a;border:2px solid #fff}
  #chat .bub b{display:block;font-size:12px;opacity:.85;margin-bottom:2px}
  .arm2{display:none}
  .dancing .person{transform-origin:50% 100%;animation:hips .45s ease-in-out infinite alternate}
  .dancing .arm{animation:floss .3s ease-in-out infinite alternate}
  .dancing .arm2{display:block;animation-direction:alternate-reverse}
  .dancing .leg{animation-duration:.25s}
  @keyframes floss{from{transform:rotate(-80deg)}to{transform:rotate(80deg)}}
  @keyframes hips{from{transform:translateX(-7px) rotate(-7deg)}to{transform:translateX(7px) rotate(7deg)}}
  @media (prefers-reduced-motion:reduce){.leg,.arm{animation-duration:1.6s}}
</style>
</head>
<body>
<div id="menu"><h1>Elif hocanın sınıfları</h1><div id="classes"></div></div>
<div id="scene">
  <div id="title">Konuşma sınavı devam ediyor<small>Lütfen sessizce oturun ve tahtayı seyredin</small></div>
  <div id="path"></div>
</div>

<div id="chat" aria-hidden="true">
  <div class="msg in"><div class="av"></div><div class="bub"><b></b><span></span></div></div>
  <div class="msg out"><div class="bub"><b></b><span></span></div><div class="av"></div></div>
</div>

<div id="panel">
  <input id="newName" placeholder="Add a student name" aria-label="Student name">
  <button id="add">Add</button>
  <button id="remove">Remove last</button>
  <button id="back">Sınıflar</button>
  <button id="hide">Hide (press H)</button>
</div>

<script>
/* ====== EDIT THIS PART ====== */
const CLASSES = {                       // put each class's real student names here
  "9/F":  ["Yusuf Nail", "Ahmet Eymen", "Emine", "Melis Kübra", "Zeynep Kayacan", "Gamze", "Zeynep Demirtola", "Yaren", "Öykü Nehir", "Nisa Nur", "Zeynep Adana", "Zeynep Cemre", "Eylül", "Öykü Bahar", "Piraye", "Zeynep Doğan", "Elif Deniz", "Mehmet Kaan", "Berat Eren", "Ömer", "Ahmet Emir", "Muhammed Emin", "Eymen Tekin", "Eymen Ayaz", "İlker Çakır", "Utku Önerbay", "Utku Erdoğan", "Saliha Betül", "Muhammed Ömer"],
  "10/B": ["Simay", "Ecrin", "Akif", "Sudenur", "Meyra", "Melis", "Seher", "Hafize İkra", "Elif Eylül", "Yağız Demir", "Göktuğ Ege", "Süleyman", "Eren Kaya", "Muhammed Taha", "Ömer Berk", "Özgür", "Yaşar Ali", "Yağmur İrem", "Yağmur", "Eysa", "Zeynep", "Nur Banu", "Zehra", "Arda", "Emir Efe", "Hale Ahsen", "Ela Nur", "Berat", "Yusuf", "Batuhan Ali", "Esat", "Enes", "Halil"],
  "10/C": ["Bahadır Eymen", "Onur Murat", "Sümeyye", "Nisanur Sole", "Ecrin Yasemin", "Mert Güven", "Beren Su", "Kader", "Yavuz İshak", "Emir", "Emre", "Çınar Ali", "İrem", "Nisa Nur Arslan", "Elifsena", "Kamile Dilan", "İbrahim", "Ömer Faruk", "Selim", "Miraç", "Ersin Efe", "Direnç Ali", "İsmail Esad", "Umut Kaan", "Gizem", "Aişe", "Namık", "Irmak", "İrem Merve Su", "Hatice", "Ada", "Enes", "Poyraz", "İsmail Torun"],
  "10/D": ["Elif Mina", "Kevser", "Melis", "Selin", "Esma Nur", "Hayrunnisa", "Duygu", "Duru", "Göksu Nur", "Zehra", "Hümeyra", "Ceylin Zeynep", "Meryem", "Nisa Nur", "Berfin", "Muhammed", "Yiğit", "İbrahim", "Uraz", "Yusuf Öztürk", "Yuşa", "Ali", "Çınar", "Emir Kayra", "Yağız Kemal", "Şeyhmus", "Mehmet Emir", "Hüseyin", "Doruk Efe", "Taha Eray", "Renas", "Ece Nur", "Ebrar", "Mustafa", "Yusuf Beyazkaya"]
};
const SAYINGS = [
  "Şşşş... Sınav zamanı", "İngilizce en sevdiğim ders.", "Bugün hava ne güzel.", "Başarılar herkese!",
  "Selam, nasılsın?", "Sadece yürüyorum.", "Sessiz olun lütfen :)", "Adın ne?",
  "Pizzayı severim.", "Bugün cuma mı?", "İngilizce konuşma pratiği yapıyorum!", "Sonra görüşürüz!"
];
const MESSAGES = [                      // the random message (top bubble)
  "Ne zaman beni ziyaret edeceksin?",
  "Haftasonu müsait misin? Hadi buluşalım!",
  "Ödevini yapmayı bitirdin mi?",
  "Şu an ne yapıyorsun?",
  "Kahvaltıda ne yedin?",
  "Uzun zamandır senden haber almadım, nasılsın??",
  "İngilizce çalışmama yardım eder misin?",
  "Hadi yarın sinemaya gidelim, olur mu??"
];
const FIXED_REPLY = "Um... I can't... But it was nice talking to you.";   // the fixed answer (bottom bubble)
const POPUP_EVERY = 10000, POPUP_STAYS = 4000;                          // milliseconds
const DANCE_EVERY = 30000, DANCE_FOR = 20000;              // milliseconds
const SHIRTS = ["#e4572e","#17bebb","#ffc914","#76b041","#a45ee5","#ff8fa3","#4d9de0","#f08a4b"];
/* ============================ */

const scene = document.getElementById("scene");
const pathEl = document.getElementById("path");
const walkers = [];
let expected = 0, activeBubbles = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function svg(shirt, skin){
  return `<svg class="person" viewBox="0 0 90 150" xmlns="http://www.w3.org/2000/svg">
    <g class="leg"><rect x="38" y="96" width="12" height="46" rx="6" fill="#33415c"/></g>
    <g class="leg b"><rect x="40" y="96" width="12" height="46" rx="6" fill="#4a5a7a"/></g>
    <g class="arm"><rect x="40" y="66" width="10" height="38" rx="5" fill="${skin}"/></g>
    <g class="arm arm2"><rect x="40" y="66" width="10" height="38" rx="5" fill="${skin}"/></g>
    <rect x="29" y="62" width="32" height="42" rx="10" fill="${shirt}"/>
    <circle cx="45" cy="42" r="19" fill="${skin}"/>
    <circle cx="52" cy="40" r="2.6" fill="#222"/>
    <path d="M47 50 q6 5 11 0" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M26 38 q2 -24 24 -22 q16 2 15 22 q-8 -12 -39 0z" fill="#3b2a20"/>
  </svg>`;
}

function addStudent(name, i = walkers.length){
  const el = document.createElement("div");
  el.className = "walker";
  const skins = ["#f2c9a0","#d9a577","#b57b50","#8a5a3b"];
  const shirt = SHIRTS[i % SHIRTS.length], skin = pick(skins);
  el.innerHTML = `<div class="bubble"></div><div class="name"></div><div class="flipper">${svg(shirt, skin)}</div>`;
  el.querySelector(".name").textContent = name;
  scene.appendChild(el);
  const w = {
    el, name, shirt, skin, dir: Math.random() < .5 ? 1 : -1,
    x: Math.random() < .5 ? -80 : innerWidth, speed: rand(30, 70),
    lane: (i * 0.618034) % 1, dance: null, k: 0, speaking: false, nextTalk: performance.now() + rand(3000, 3000 + Math.max(6000, expected * 1000))
  };
  walkers.push(w);
}

function say(w){
  if (activeBubbles >= 4){ w.nextTalk = performance.now() + rand(1000, 3000); return; }   // never more than 4 bubbles at once
  const b = w.el.querySelector(".bubble"), dur = rand(2500, 4000);
  b.textContent = pick(SAYINGS);
  b.classList.add("show"); w.speaking = true; activeBubbles++;
  setTimeout(() => { b.classList.remove("show"); w.speaking = false; activeBubbles = Math.max(0, activeBubbles - 1); }, dur);
}

let last = performance.now();
function tick(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const n = Math.max(walkers.length, expected);
  const base = n <= 10 ? 1 : Math.max(0.55, 1 - (n - 10) * 0.017);   // more students = smaller avatars
  for (const w of walkers){
    if (w.dance && now > w.dance){ w.dance = null; w.el.classList.remove("dancing"); }
    w.k += ((w.dance ? 1 : 0) - w.k) * Math.min(1, dt * 3);          // 0 = walking, 1 = dancing up front
    const L = w.lane + (1 - w.lane) * w.k;                           // dancer moves to the front lane
    const s = base * (0.75 + 0.25 * L) * (1 + 0.7 * w.k);            // students further back look smaller; dancer gets bigger
    const h = 150 * s;
    if (w.dance){
      w.x += (innerWidth / 2 - 45 - w.x) * Math.min(1, dt * 2);      // glide to the middle of the screen
    } else {
      w.x += w.dir * w.speed * s * dt;
      if (w.x < -90) w.dir = 1; else if (w.x < -10 && w.dir < 0) w.dir = 1;
      if (w.x > innerWidth) w.dir = -1; else if (w.x > innerWidth - 80 && w.dir > 0) w.dir = -1;
    }
    const foot = innerHeight * 0.52 + L * innerHeight * 0.42;
    w.el.style.height = h + "px";
    w.el.style.transform = `translate(${w.x}px, ${foot - h}px)`;
    w.el.style.zIndex = w.speaking ? 9000 : w.dance ? 8500 : Math.round(foot);
    w.el.querySelector(".flipper").style.transform = `scale(${w.dir < 0 ? -s : s}, ${s})`;
    if (now > w.nextTalk){ say(w); w.nextTalk = now + rand(0.7, 1.3) * Math.max(5000, n * 1400); }
  }
  requestAnimationFrame(tick);
}

/* chat pop-up: two random students on screen, random message, fixed answer */
const chat = document.getElementById("chat");
const faceSvg = w => svg(w.shirt, w.skin).replace('class="person" viewBox="0 0 90 150"', 'viewBox="18 10 54 54"');
let chatHide = null;
function showChat(){
  if (!menu.classList.contains("gone") || walkers.length < 2) return;
  const a = pick(walkers);
  let b; do { b = pick(walkers); } while (b === a);
  const [m1, m2] = chat.querySelectorAll(".msg");
  m1.querySelector(".av").innerHTML = faceSvg(a);
  m1.querySelector("b").textContent = a.name;
  m1.querySelector("span").textContent = pick(MESSAGES);
  m2.querySelector(".av").innerHTML = faceSvg(b);
  m2.querySelector("b").textContent = b.name;
  m2.querySelector("span").textContent = FIXED_REPLY;
  chat.classList.add("show");
  clearTimeout(chatHide);
  chatHide = setTimeout(() => chat.classList.remove("show"), POPUP_STAYS);
}
setInterval(showChat, POPUP_EVERY);

/* every DANCE_EVERY ms a random student walks to the front and dances for DANCE_FOR ms */
function startDance(){
  if (!menu.classList.contains("gone")) return;
  const free = walkers.filter(w => !w.dance);
  if (!free.length || free.length < walkers.length) return;           // wait if someone is already dancing
  const w = pick(free);
  w.dance = performance.now() + DANCE_FOR;
  w.el.classList.add("dancing");
}
setInterval(startDance, DANCE_EVERY);

/* students are stored per class in this browser, so last-minute changes are remembered */
let current = null, timers = [];
const menu = document.getElementById("menu");
function save(){ try{ localStorage.setItem("qw-"+current, JSON.stringify(walkers.map(w => w.name))); }catch(e){} }

function openClass(c){
  closeClass();
  current = c;
  let names = CLASSES[c];
  try{ const s = JSON.parse(localStorage.getItem("qw-"+c)); if (Array.isArray(s)) names = s; }catch(e){}
  expected = names.length;
  menu.classList.add("gone");
  document.getElementById("title").firstChild.textContent = "Konuşma sınavı devam ediyor – " + c;
  const gap = Math.min(900, 12000 / names.length);   // everyone has arrived within about 12 seconds
  names.forEach((n, i) => timers.push(setTimeout(() => addStudent(n, i), 400 + i * gap)));  // they arrive one by one
}
function closeClass(){
  timers.forEach(clearTimeout); timers = [];
  walkers.splice(0).forEach(w => w.el.remove());
  chat.classList.remove("show");
  expected = 0; activeBubbles = 0;
  menu.classList.remove("gone");
}
Object.keys(CLASSES).forEach(c => {
  const b = document.createElement("button");
  b.textContent = c; b.onclick = () => openClass(c);
  document.getElementById("classes").appendChild(b);
});
document.getElementById("back").onclick = closeClass;

const input = document.getElementById("newName");
function addFromInput(){
  const n = input.value.trim();
  if (!n) return;
  addStudent(n); input.value = ""; save();
}
document.getElementById("add").onclick = addFromInput;
input.addEventListener("keydown", e => { if (e.key === "Enter") addFromInput(); });
document.getElementById("remove").onclick = () => { const w = walkers.pop(); if (w) w.el.remove(); save(); };
const panel = document.getElementById("panel");
document.getElementById("hide").onclick = () => panel.classList.add("hidden");
addEventListener("keydown", e => {
  if (e.target === input) return;
  if (e.key.toLowerCase() === "h") panel.classList.toggle("hidden");
});

requestAnimationFrame(tick);
</script>
</body>
</html>
